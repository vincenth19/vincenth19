<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="weave" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.95" numOctaves="2" seed="4" stitchTiles="stitch" result="warp"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.95 0.012" numOctaves="2" seed="11" stitchTiles="stitch" result="weft"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="2" stitchTiles="stitch" result="slub"/>
    <feComposite in="warp" in2="weft" operator="arithmetic" k1="0" k2="0.55" k3="0.55" k4="-0.05" result="cross"/>
    <feComposite in="cross" in2="slub" operator="arithmetic" k1="0" k2="0.85" k3="0.25" k4="-0.06" result="mix"/>
    <feColorMatrix in="mix" type="matrix" values="0.14 0.14 0.14 0 0.29  0.14 0.14 0.14 0 0.29  0.14 0.14 0.14 0 0.29  0 0 0 0 1"/>
  </filter>
  <rect width="256" height="256" filter="url(#weave)"/>
</svg>
